---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuworkloads.aperture.ai
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: aperture.ai
  names:
    kind: GPUWorkload
    listKind: GPUWorkloadList
    plural: gpuworkloads
    singular: gpuworkload
    shortNames:
      - gw
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelName
        - name: GPU
          type: integer
          jsonPath: .spec.gpu
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Pod
          type: string
          jsonPath: .status.podName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            GPUWorkload is the Schema for the gpuworkloads API.
            It represents a GPU-accelerated inference workload managed by the Aperture operator.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: GPUWorkloadSpec defines the desired state of a GPU-accelerated inference workload.
              type: object
              required:
                - modelName
              properties:
                modelName:
                  description: >-
                    HuggingFace model identifier to serve (e.g., "facebook/opt-125m").
                  type: string
                  minLength: 1
                gpu:
                  description: Number of GPUs to allocate (0-8).
                  type: integer
                  minimum: 0
                  maximum: 8
                partitionMode:
                  description: 'GPU partitioning strategy: "MPS" or "MIG".'
                  type: string
                  enum:
                    - MPS
                    - MIG
                  default: MPS
                tokenQuota:
                  description: Maximum number of tokens this workload can generate.
                  type: integer
                  minimum: 1
                  maximum: 100000
                kvCacheGB:
                  description: Size of the KV cache in gigabytes for paged attention.
                  type: integer
                  minimum: 1
                  default: 1
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                priorityClassName:
                  type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
            status:
              description: GPUWorkloadStatus defines the observed state of a GPUWorkload.
              type: object
              properties:
                phase:
                  description: 'Current lifecycle phase: Pending, Running, Completed, or Failed.'
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Completed
                    - Failed
                podName:
                  description: Name of the Kubernetes Pod running the inference server.
                  type: string
                message:
                  description: Human-readable detail about the current status.
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                startTime:
                  format: date-time
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      lastTransitionTime:
                        format: date-time
                        type: string
                      message:
                        maxLength: 32768
                        type: string
                      reason:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        enum:
                        - "True"
                        - "False"
                        - Unknown
                        type: string
                      type:
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                    - lastTransitionTime
                    - message
                    - reason
                    - status
                    - type
                  x-kubernetes-list-map-keys:
                  - type
                  x-kubernetes-list-type: map
