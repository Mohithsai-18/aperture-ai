---
apiVersion: v1
kind: Namespace
metadata:
  name: aperture-system
  labels:
    app.kubernetes.io/name: aperture-operator
    app.kubernetes.io/managed-by: aperture
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aperture-operator
  namespace: aperture-system
  labels:
    app.kubernetes.io/name: aperture-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aperture-operator-role
rules:
  # GPUWorkload CRUD
  - apiGroups: ["aperture.ai"]
    resources: ["gpuworkloads"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["aperture.ai"]
    resources: ["gpuworkloads/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["aperture.ai"]
    resources: ["gpuworkloads/finalizers"]
    verbs: ["update"]
  # Pod management (read-only — pods are managed by Deployments now)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Deployment management
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Service management
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aperture-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aperture-operator-role
subjects:
  - kind: ServiceAccount
    name: aperture-operator
    namespace: aperture-system

---
# NetworkPolicy: restrict inference pod egress to DNS + model registries only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aperture-inference-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: aperture-inference
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS (model downloads from HuggingFace)
    - to: []
      ports:
        - protocol: TCP
          port: 443
