---
# ConfigMap: auto-loads the Aperture AI dashboard into Grafana via sidecar
apiVersion: v1
kind: ConfigMap
metadata:
  name: aperture-grafana-dashboard
  namespace: aperture-monitoring
  labels:
    grafana_dashboard: "1"          # picked up by the Grafana sidecar
data:
  aperture-ai.json: |-
    {
      "title": "Aperture AI — Inference Observability",
      "uid": "aperture-ai-v1",
      "tags": ["aperture", "llm", "inference"],
      "timezone": "browser",
      "refresh": "15s",
      "schemaVersion": 38,
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Total Requests",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(aperture_requests_total)", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "blue", "value": null }] } } }
        },
        {
          "id": 2, "type": "stat", "title": "Tokens Generated",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(aperture_tokens_generated_total)", "refId": "A" }],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } }
        },
        {
          "id": 3, "type": "stat", "title": "Avg Latency (ms)",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "avg(aperture_avg_request_latency_ms)", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ms", "thresholds": { "steps": [{"color":"green","value":null},{"color":"yellow","value":500},{"color":"red","value":2000}] } } }
        },
        {
          "id": 4, "type": "gauge", "title": "Quota Used %",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "(sum(aperture_tokens_generated_total) / sum(aperture_token_quota)) * 100", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "thresholds": { "steps": [{"color":"green","value":null},{"color":"yellow","value":70},{"color":"red","value":90}] } } }
        },
        {
          "id": 5, "type": "stat", "title": "Engine Mode",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(aperture_engine_loaded)", "refId": "A" }],
          "fieldConfig": { "defaults": { "mappings": [{"type":"value","options":{"0":{"text":"CPU Fallback","color":"yellow"},"1":{"text":"GPU Active","color":"green"}}}] } }
        },
        {
          "id": 7, "type": "timeseries", "title": "Request Rate (req/min)",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "rate(aperture_requests_total[1m]) * 60", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "reqpm", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 8, "type": "timeseries", "title": "Token Throughput (tokens/min)",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "rate(aperture_tokens_generated_total[1m]) * 60", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 9, "type": "timeseries", "title": "Avg Request Latency (ms)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "aperture_avg_request_latency_ms", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "fillOpacity": 10 } } }
        },
        {
          "id": 10, "type": "timeseries", "title": "Token Quota Remaining",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "aperture_token_quota_remaining", "legendFormat": "{{pod}}", "refId": "A" }],
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 15 } } }
        }
      ]
    }
