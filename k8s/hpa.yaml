apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aperture-inference-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aperture-inference
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # requires prometheus-adapter config
    - type: External
      external:
        metric:
          name: DCGM_FI_DEV_GPU_UTIL
        target:
          type: Value
          value: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
