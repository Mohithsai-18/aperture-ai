# Aperture AI Helm Chart — Default Values
# Override per environment with values-staging.yaml / values-production.yaml

# ── Global ────────────────────────────────────────────────────────────────────
global:
  imageRegistry: docker.io
  imagePullSecrets: []
  storageClass: ""

# ── Inference Server ──────────────────────────────────────────────────────────
inference:
  enabled: true
  replicaCount: 1

  image:
    repository: mohithsai18/aperture-inference
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    metricsPort: 8080

  ingress:
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    hosts:
      - host: aperture.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: aperture-tls
        hosts:
          - aperture.example.com

  env:
    MODEL_PATH: "facebook/opt-125m"
    TOKEN_QUOTA: "100000"
    KV_CACHE_GB: "4"
    USE_GPU: "false"
    HOME: "/tmp"
    TORCH_HOME: "/tmp/torch"
    TORCHINDUCTOR_CACHE_DIR: "/tmp/torchinductor"
    HF_HOME: "/tmp/huggingface"
    OTEL_ENABLED: "false"

  # Secret keys — pulled from the aperture-secrets K8s Secret
  secretEnv:
    HF_TOKEN:
      secretName: aperture-secrets
      key: hf-token

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  gpu:
    enabled: false
    count: 0

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  topologySpreadConstraints: []

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  # Model preloader init container
  preloader:
    enabled: true
    image:
      repository: mohithsai18/aperture-inference
      tag: latest
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ── Operator ──────────────────────────────────────────────────────────────────
operator:
  enabled: true
  replicaCount: 1
  image:
    repository: mohithsai18/aperture-operator
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Observability ─────────────────────────────────────────────────────────────
monitoring:
  enabled: true
  podMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true

# ── Network Policy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: true

# ── Service Account ───────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Secrets (managed externally, referenced here) ─────────────────────────────
secrets:
  create: true          # Creates a placeholder Secret; override with real values
  name: aperture-secrets
