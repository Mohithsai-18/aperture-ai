{{- if and .Values.inference.enabled .Values.inference.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aperture-ai.fullname" . }}-inference
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aperture-ai.labels" . | nindent 4 }}
  {{- with .Values.inference.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.inference.ingress.className }}
  ingressClassName: {{ .Values.inference.ingress.className }}
  {{- end }}
  {{- if .Values.inference.ingress.tls }}
  tls:
    {{- range .Values.inference.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.inference.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "aperture-ai.fullname" $ }}-inference
                port:
                  number: {{ $.Values.inference.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
