{{- if .Values.secrets.create }}
# Placeholder secret — replace values with base64-encoded real values
# or use External Secrets Operator to sync from Vault/AWS Secrets Manager.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aperture-ai.labels" . | nindent 4 }}
  annotations:
    # Tells Helm to skip this secret in diffs (prevents leaking values in CI logs)
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Override these with real base64-encoded values:
  # echo -n "hf_your_token_here" | base64
  hf-token: ""
  otel-api-key: ""
{{- end }}
