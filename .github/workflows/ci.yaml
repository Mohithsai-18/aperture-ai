name: CI — Build, Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  INFERENCE_IMAGE: mohithsai18/aperture-inference
  OPERATOR_IMAGE: mohithsai18/aperture-operator

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Static Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python (inference/)
        run: ruff check inference/ --output-format=github

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Lint Go (operator/)
        working-directory: operator
        run: go vet ./...

      - name: Helm lint
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"
      - run: helm lint helm/aperture-ai/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit Tests
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: inference
        run: pip install fastapi uvicorn httpx pytest pytest-asyncio pydantic opentelemetry-api opentelemetry-sdk

      - name: Run pytest
        working-directory: inference
        run: pytest test_server.py -v --tb=short
        env:
          MODEL_PATH: facebook/opt-125m
          USE_GPU: "false"

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build & Push Inference Image
  # ─────────────────────────────────────────────────────────────────────────────
  build-inference:
    name: Build Inference Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.INFERENCE_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./inference
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Build & Push Operator Image
  # ─────────────────────────────────────────────────────────────────────────────
  build-operator:
    name: Build Operator Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./operator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Deploy to Staging (auto, on main push)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: [build-inference, build-operator]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Helm upgrade — staging
        run: |
          IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          helm upgrade --install aperture-ai ./helm/aperture-ai \
            --namespace aperture-staging \
            --create-namespace \
            --values helm/aperture-ai/values-staging.yaml \
            --set inference.image.tag=${IMAGE_TAG} \
            --set operator.image.tag=${IMAGE_TAG} \
            --wait \
            --timeout 10m \
            --atomic

      - name: Smoke test staging
        run: |
          kubectl wait --for=condition=Ready pod \
            -l app=aperture-inference \
            -n aperture-staging \
            --timeout=120s
          kubectl get pods -n aperture-staging

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 6: Deploy to Production (manual gate)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production          # Requires manual approval in GitHub Environments
    steps:
      - uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Helm upgrade — production (canary 20%)
        run: |
          IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          # Deploy canary replica first
          helm upgrade --install aperture-ai-canary ./helm/aperture-ai \
            --namespace aperture-production \
            --create-namespace \
            --values helm/aperture-ai/values-production.yaml \
            --set inference.image.tag=${IMAGE_TAG} \
            --set inference.replicaCount=1 \
            --set inference.canary=true \
            --wait --timeout 5m

      - name: Promote canary → full production
        run: |
          IMAGE_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          helm upgrade --install aperture-ai ./helm/aperture-ai \
            --namespace aperture-production \
            --values helm/aperture-ai/values-production.yaml \
            --set inference.image.tag=${IMAGE_TAG} \
            --set operator.image.tag=${IMAGE_TAG} \
            --wait --timeout 10m --atomic
          # Remove canary after full rollout
          helm uninstall aperture-ai-canary -n aperture-production --wait
