name: Release — Tag, Build & Publish

on:
  push:
    tags:
      - "v*.*.*"

env:
  INFERENCE_IMAGE: mohithsai18/aperture-inference
  OPERATOR_IMAGE: mohithsai18/aperture-operator

jobs:
  release:
    name: Build & Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create GitHub Release
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # needed for changelog generation

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build & push inference image
        uses: docker/build-push-action@v5
        with:
          context: ./inference
          push: true
          tags: |
            ${{ env.INFERENCE_IMAGE }}:${{ github.ref_name }}
            ${{ env.INFERENCE_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.INFERENCE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push operator image
        uses: docker/build-push-action@v5
        with:
          context: ./operator
          push: true
          tags: |
            ${{ env.OPERATOR_IMAGE }}:${{ github.ref_name }}
            ${{ env.OPERATOR_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.OPERATOR_IMAGE }}:latest

      - name: Package Helm chart
        run: |
          helm package helm/aperture-ai/ --version ${{ steps.version.outputs.VERSION }} --app-version ${{ github.ref_name }}

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges | head -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aperture AI ${{ github.ref_name }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGES }}

            ## Docker Images
            - `${{ env.INFERENCE_IMAGE }}:${{ github.ref_name }}`
            - `${{ env.OPERATOR_IMAGE }}:${{ github.ref_name }}`

            ## Helm Install
            ```bash
            helm upgrade --install aperture-ai oci://registry-1.docker.io/mohithsai18/aperture-ai \
              --version ${{ steps.version.outputs.VERSION }} \
              --namespace aperture-production --create-namespace
            ```
          files: |
            aperture-ai-${{ steps.version.outputs.VERSION }}.tgz
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
